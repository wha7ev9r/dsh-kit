name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package should be published
        required: true
        type: choice
        options:
          - both
          - theme
          - console
          - anysearch

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install locked workspace
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate package sources
        run: bun run check
      # Bun installs and validates; publishing stays on the npm CLI because
      # `bun publish` supports neither --provenance nor OIDC trusted publishing.
      - name: Publish selected packages with npm Trusted Publishing
        run: |
          if [ "${{ inputs.package }}" = "theme" ] || [ "${{ inputs.package }}" = "both" ]; then
            (cd packages/dsh-firefly-theme && npm publish --registry=https://registry.npmjs.org --access public --provenance)
          fi
          if [ "${{ inputs.package }}" = "console" ] || [ "${{ inputs.package }}" = "both" ]; then
            (cd packages/dsh-mcp-console && npm publish --registry=https://registry.npmjs.org --access public --provenance)
          fi
          if [ "${{ inputs.package }}" = "anysearch" ]; then
            bun run --filter @wha7ever/dsh-web-search-anysearch build
            (cd packages/dsh-web-search-anysearch && npm publish --registry=https://registry.npmjs.org --access public --provenance)
          fi

name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package should be published
        required: true
        type: choice
        options:
          - both
          - theme
          - console

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate package sources
        run: pnpm run check
      - name: Check npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN was not available to this job" >&2
            exit 1
          fi
          echo "NPM_TOKEN is available"
          pnpm whoami --registry=https://registry.npmjs.org
      - name: Publish selected packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.package }}" = "theme" ] || [ "${{ inputs.package }}" = "both" ]; then
            pnpm --filter @wha7ever/dsh-firefly-theme publish --registry=https://registry.npmjs.org --access public --provenance --no-git-checks
          fi
          if [ "${{ inputs.package }}" = "console" ] || [ "${{ inputs.package }}" = "both" ]; then
            pnpm --filter @wha7ever/dsh-mcp-console publish --registry=https://registry.npmjs.org --access public --provenance --no-git-checks
          fi

name: Inspect npm trusted publishers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Read trusted publisher configuration
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm trust list @wha7ever/dsh-firefly-theme --registry=https://registry.npmjs.org
          npm trust list @wha7ever/dsh-mcp-console --registry=https://registry.npmjs.org
